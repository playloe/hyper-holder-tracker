name: Atualizar Holders Diariamente

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        # VOLTAMOS PARA A BIBLIOTECA PADRÃO, POIS AGORA TEMOS A API KEY OFICIAL:
        run: pip install requests

      - name: Run collector
        run: python update_holders.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add holders.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update holders data" && git push)
